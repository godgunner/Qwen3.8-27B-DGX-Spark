# Recipe: unsloth/Qwen3.8-27B-NVFP4
# unsloth/Qwen3.8-27B-NVFP4 model as dense NVFP4 (W4A4)

recipe_version: "1"
name: Qwen3.8-27B-NVFP4
description: vLLM serving Qwen3.8-27B dense hybrid-attention (NVFP4)

# HuggingFace model to download (optional, for --download-model)
model: unsloth/Qwen3.8-27B-NVFP4

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.6-chat-template

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # NVFP4 model is ~16-22 GiB (W4A4) — maximum memory efficiency.
  # 0.55 tested on this box: currently running with ~123 GB system memory in use, no swap.
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_batched_tokens: 8192
  # Single-user box: cap concurrency to keep batch-1 decode latency
  max_num_seqs: 4

# Environment variables
env:
  {
    "HF_HOME": "/root/.cache/huggingface",
    "HF_HUB_OFFLINE": "1",
    "TRANSFORMERS_VERSION": "5.8.0"
  }

# Sampling parameters (from Qwen docs Best Practices, also baked into generation_config.json)
# vLLM will auto-pick up temperature=1.0, top_p=0.95, top_k=20 from the model's generation_config.json.
# This produces the informational warning on startup — it is correct behavior (not an error).
#
# Thinking Mode (default):  temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0
# Instruct Mode (no think): temperature=0.7, top_p=0.80, top_k=20, min_p=0.0, presence_penalty=1.5, repetition_penalty=1.0

# vLLM serve command — NVFP4 with MTP speculative decoding
# NOTE: run-recipe.py str.format()s this command, so literal JSON braces are
# doubled ({{ }}). Line 1 is an inline JIT prewarm (backgrounded): once
# /health is up it fires 1,2,3,4 concurrent tiny requests so the
# per-batch-shape Triton kernels (mamba_align, eagle_*, page-copy, expand)
# compile BEFORE the first real turn. Without it, the first Copilot request
# hangs 1-3 min at <1 tok/s while kernels JIT mid-generation (the
# jit_monitor.py:141 "consider extending warmup" warnings). Line 2+ is the
# actual vLLM server (foreground).
command: |
  ( for i in $(seq 1 600); do curl -fsS http://127.0.0.1:{port}/health >/dev/null 2>&1 && break; sleep 2; done; for c in 1 2 3 4; do pids=(); for _ in $(seq 1 $c); do curl -fsS http://127.0.0.1:{port}/v1/chat/completions -H "Content-Type: application/json" -d '{{"model": "Qwen3.8-27B-NVFP4", "messages": [{{"role": "user", "content": "Reply with the single word: ok."}}], "max_tokens": 8, "temperature": 0.0, "chat_template_kwargs": {{"enable_thinking": false}}}}' >/dev/null 2>&1 & pids+=("$!"); done; wait || true; done; echo "[prewarm] done — batch-shape kernels compiled" ) >/tmp/prewarm_nvfp4.log 2>&1 &
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --served-model-name Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --quantization compressed-tensors \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}' \
    --max-num-seqs {max_num_seqs} \
    --attention-backend triton_attn \
    --trust-remote-code \
