# Recipe: Qwen/Qwen3.8-27B-FP8
# FP8 quality lane — baseline config for the 1/2/3-concurrency test matrix.
# (Former "ultra-long context concurrency" experiment preserved in comments below.)
recipe_version: "1"
name: Qwen3.8-27B-FP8
description: vLLM serving Qwen3.8-27B dense hybrid-attention (FP8) with 262k context window

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-27B-FP8

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.6-chat-template

# Baseline (matches BF16 lane shape so the 1/2/3-concurrency matrix is apples-to-apples)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # FP8 model is ~30 GiB vs ~52 GiB BF16 → more KV cache headroom.
  # 0.55 — tested safe value on single DGX Spark (GB10), no swap; a driver OOM can wedge the node.
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_batched_tokens: 16384
  # Single-user box: cap concurrency to keep batch-1 decode latency
  max_num_seqs: 4

# Environment variables
env:
  {
    "HF_HOME": "/root/.cache/huggingface",
    "HF_HUB_OFFLINE": "1",
    "TRANSFORMERS_VERSION": "5.8.0",
  }

# vLLM serve command — FP8 with MTP speculative decoding
# NOTE: run-recipe.py str.format()s this command, so literal JSON braces are
# doubled ({{ }}). Line 1 is an inline JIT prewarm (backgrounded) — same
# rationale as the NVFP4 recipe: compiles per-batch-shape Triton kernels
# before the first real turn (see the NVFP4 recipe for details).
command: |
  ( for i in $(seq 1 600); do curl -fsS http://127.0.0.1:{port}/health >/dev/null 2>&1 && break; sleep 2; done; for c in 1 2 3 4; do pids=(); for _ in $(seq 1 $c); do curl -fsS http://127.0.0.1:{port}/v1/chat/completions -H "Content-Type: application/json" -d '{{"model": "Qwen3.8-27B-FP8", "messages": [{{"role": "user", "content": "Reply with the single word: ok."}}], "max_tokens": 8, "temperature": 0.0, "chat_template_kwargs": {{"enable_thinking": false}}}}' >/dev/null 2>&1 & pids+=("$!"); done; wait || true; done; echo "[prewarm] done — batch-shape kernels compiled" ) >/tmp/prewarm_fp8.log 2>&1 &
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --served-model-name Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":5}}' \
    --max-num-seqs {max_num_seqs} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --trust-remote-code \
    --mm-encoder-tp-mode data \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray

# ---------------------------------------------------------------------------
# EXPERIMENT (saved 2026-08-16, tested as VS Code workhorse, NOT part of the
# baseline matrix — see TESTING.md experiment E2):
